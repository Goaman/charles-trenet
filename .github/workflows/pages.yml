# Builds the static site (bun run export) and publishes it on GitHub Pages.
# Runs on every push, and every night: the home page shows a song and a
# "ce jour-là" entry that change daily.
name: GitHub Pages

on:
  push:
    branches: [master]
  schedule:
    - cron: "5 23 * * *" # just after midnight, Paris time
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - id: pages
        uses: actions/configure-pages@v5
      - run: bun run export --site-url "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
